# Render Blueprint — Firebase privilege relay ONLY.
#
# This repository contains the relay and nothing else. No pharmacy source
# code, no models, no business logic — just the small service that holds the
# Firebase service-account key so customer installers never have to.
#
# On Render:  New → Blueprint → pick this repository.
#
# Two things are NOT in this file and must be set in the Render dashboard,
# because neither belongs in a git repository:
#
#   1. Secret File   firebase_service_account.json   (mounts at /etc/secrets/)
#   2. Env var       RELAY_SECRET                    (marked sync:false below)
#
# See README.md for the click-by-click steps.

services:
  - type: web
    name: pharmacy-relay
    runtime: python
    # "starter" (~$7/mo) stops the instance sleeping. On free, the first
    # request after ~15 minutes of quiet spends most of a minute waking up —
    # survivable for the background sync, which retries, but a poor experience
    # for a pharmacist sitting on the activation screen.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: FIREBASE_SERVICE_ACCOUNT
        value: /etc/secrets/firebase_service_account.json
      - key: RELAY_SECRET
        sync: false            # set by hand in the dashboard; never committed
      # Set ONLY while rotating the shared secret. The secret is baked into
      # each desktop build, so changing it invalidates every installer already
      # in the field; accepting the previous one for a few days turns that
      # cliff into a staged change. Clear it once customers have updated —
      # the log prints a line whenever a request arrives on the old secret,
      # so it tells you when nobody is using it any more.
      - key: RELAY_SECRET_PREVIOUS
        sync: false
